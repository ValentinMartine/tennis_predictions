name: Regenerate tennis predictions

on:
  schedule:
    # Tous les jours à 06:10 UTC : re-télécharge les saisons, réentraîne, republie.
    # (Le patch Sofascore des Grands Chelems est local : ses résultats sont committés
    # dans data/results_patch.csv et fusionnés ici aussi.)
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-tennis
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download seasons
        run: |
          python scripts/download_data.py atp
          python scripts/download_data.py wta

      - name: Fetch upcoming schedule
        run: python scripts/fetch_upcoming.py

      - name: Train and export
        run: |
          python scripts/train_and_backtest.py atp
          python -m src.export atp
          python scripts/train_and_backtest.py wta
          python -m src.export wta
          python scripts/validate_exports.py atp
          python scripts/validate_exports.py wta

      - name: Commit regenerated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tennis_predictions.json data/tennis_elo_history.json data/source_status.json
          git add data/tennis_predictions_wta.json data/tennis_elo_history_wta.json data/source_status_wta.json
          git add data/upcoming_raw.json
          if git diff --cached --quiet; then
            echo "No prediction changes."
          else
            git commit -m "Regenerate tennis predictions"
            git push
          fi
